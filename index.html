<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具控制台 - Tools Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom font settings if needed, using system stack by default */
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-600 antialiased min-h-screen">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <!-- Header Area -->
        <header class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-10 border-b border-gray-200 pb-6">
            <div>
                <h1 class="text-3xl md:text-4xl font-bold text-gray-900 tracking-tight">工具控制台</h1>
                <p class="mt-2 text-lg text-gray-500">提升工作效率的独立功能服务集合</p>
            </div>
            <div class="self-start md:self-center">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-indigo-100 text-indigo-800 border border-indigo-200">
                    <span class="w-2 h-2 mr-1.5 bg-indigo-500 rounded-full animate-pulse"></span>
                    Preview Edition v1.0
                </span>
            </div>
        </header>

        <!-- Tools Grid -->
        <main id="tools-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be injected here via JavaScript -->
        </main>
    </div>

    <script>
        // Data Mockup
        const tools = [
            {
                id: 1,
                title: "格式转换器",
                category: "办公",
                categoryColor: "blue",
                icon: "fa-file-arrow-right",
                description: "用法：上传 PDF 文件，一键转换为可编辑的 Word 文档，保留原排版。",
                highlight: "⚡️ 效率提升：80%",
                highlightIcon: "fa-bolt"
            },
            {
                id: 2,
                title: "配色生成器",
                category: "设计",
                categoryColor: "purple",
                icon: "fa-palette",
                description: "用法：输入主色调或关键词，AI 自动生成和谐的配色方案并提供色值。",
                highlight: "🎨 灵感激发：100%",
                highlightIcon: "fa-lightbulb"
            },
            {
                id: 3,
                title: "文本清洗",
                category: "开发",
                categoryColor: "emerald",
                icon: "fa-broom",
                description: "用法：粘贴文本，自动去除多余空行、特殊字符及 HTML 标签。",
                highlight: "🧹 纯净度：Perfect",
                highlightIcon: "fa-check-circle"
            },
            {
                id: 4,
                title: "图片压缩",
                category: "媒体",
                categoryColor: "rose",
                icon: "fa-image",
                description: "用法：拖拽 PNG/JPG 图片，智能无损压缩，大幅减小体积。",
                highlight: "💾 节省空间：60%+",
                highlightIcon: "fa-hard-drive"
            },
            {
                id: 5,
                title: "正则测试",
                category: "开发",
                categoryColor: "emerald",
                icon: "fa-code",
                description: "用法：实时输入正则表达式与测试文本，高亮显示匹配结果。",
                highlight: "🛠️ 调试速度：Instant",
                highlightIcon: "fa-rocket"
            },
            {
                id: 6,
                title: "汇率计算",
                category: "金融",
                categoryColor: "amber",
                icon: "fa-coins",
                description: "用法：实时获取全球货币汇率，支持多币种快速换算。",
                highlight: "💰 数据同步：Real-time",
                highlightIcon: "fa-sync-alt"
            }
        ];

        // Color mapping for badges
        const colorStyles = {
            blue: 'bg-blue-100 text-blue-700 border-blue-200',
            purple: 'bg-purple-100 text-purple-700 border-purple-200',
            emerald: 'bg-emerald-100 text-emerald-700 border-emerald-200',
            rose: 'bg-rose-100 text-rose-700 border-rose-200',
            amber: 'bg-amber-100 text-amber-700 border-amber-200',
            gray: 'bg-gray-100 text-gray-700 border-gray-200'
        };

        // Render Function
        function renderTools() {
            const container = document.getElementById('tools-grid');
            let htmlContent = '';

            tools.forEach(tool => {
                const badgeStyle = colorStyles[tool.categoryColor] || colorStyles.gray;
                
                htmlContent += `
                    <div class="group bg-white rounded-xl border border-gray-200 p-5 shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-1 flex flex-col h-full">
                        <!-- Card Header -->
                        <div class="flex justify-between items-start mb-3">
                            <span class="inline-block px-2.5 py-1 rounded-full text-xs font-semibold border ${badgeStyle}">
                                ${tool.category}
                            </span>
                            <div class="w-10 h-10 rounded-lg bg-gray-50 flex items-center justify-center text-gray-500 group-hover:bg-gray-100 group-hover:text-gray-700 transition-colors">
                                <i class="fa-solid ${tool.icon} text-lg"></i>
                            </div>
                        </div>

                        <!-- Card Body -->
                        <div class="mb-4 flex-grow">
                            <h3 class="text-xl font-bold text-gray-900 mb-1 group-hover:text-indigo-600 transition-colors">
                                ${tool.title}
                            </h3>
                            <p class="text-sm text-gray-600 leading-relaxed">
                                ${tool.description}
                            </p>
                        </div>

                        <!-- Card Footer/Highlight -->
                        <div class="pt-3 border-t border-gray-100 flex items-center text-sm font-medium text-gray-500">
                            <i class="fa-solid ${tool.highlightIcon} mr-2 ${getHighlightColor(tool.categoryColor)}"></i>
                            <span class="${getHighlightColor(tool.categoryColor)}">${tool.highlight}</span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = htmlContent;
        }

        // Helper for highlight text color
        function getHighlightColor(colorName) {
            const map = {
                blue: 'text-blue-600',
                purple: 'text-purple-600',
                emerald: 'text-emerald-600',
                rose: 'text-rose-600',
                amber: 'text-amber-600',
                gray: 'text-gray-600'
            };
            return map[colorName] || 'text-gray-600';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', renderTools);
    </script>
</body>
</html>
