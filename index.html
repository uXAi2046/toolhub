        let currentLang = localStorage.getItem('language') || 'en';

        function updateLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('language', lang);
            
            // Update HTML lang attribute
            document.documentElement.lang = lang;
            
            // Update language button text
            document.getElementById('currentLang').textContent = lang.toUpperCase();
            
            // Update all elements with data-i18n attribute
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });
            
            // Update placeholder
            document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
                const key = element.getAttribute('data-i18n-placeholder');
                if (translations[lang] && translations[lang][key]) {
                    element.placeholder = translations[lang][key];
                }
            });
            
            // Re-render categories and tools with new language
            renderFilters();
            const activeCat = categories.find(c => c.active).id;
            const searchVal = document.getElementById('searchInput').value;
            renderTools(activeCat, searchVal);
        }

        // Helper function to get translated text
        function t(key) {
            return translations[currentLang][key] || key;
        }

        // --- Render Functions ---

        function renderFilters() {
            const container = document.getElementById('categoryFilters');
            container.innerHTML = categories.map(cat => `
                <button 
                    onclick="setFilter('${cat.id}')"
                    class="px-4 py-1.5 rounded-full text-sm font-medium transition-all duration-200 border ${
                        cat.active 
                        ? 'bg-slate-900 text-white border-slate-900 shadow-sm' 
                        : 'bg-white text-gray-600 border-gray-200 hover:border-gray-300 hover:bg-gray-50'
                    }">
                    ${t('category.' + cat.id)}
                </button>
            `).join('');
        }

        function renderTools(filterId = 'all', searchQuery = '') {
            const container = document.getElementById('toolsGrid');
            
            // Filter logic
            const filteredTools = tools.filter(tool => {
                const matchesCategory = filterId === 'all' || 
                                        tool.category.toLowerCase().includes(filterId) ||
                                        (filterId === 'development' && tool.category === 'Development') ||
                                        (filterId === 'productivity' && tool.category === 'Productivity') ||
                                        (filterId === 'productivity' && tool.category === 'Project Management'); 

                const toolName = t(tool.nameKey);
                const toolDesc = t(tool.descKey);
                
                const matchesSearch = toolName.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      toolDesc.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      tool.vendor.toLowerCase().includes(searchQuery.toLowerCase());

                return matchesCategory && matchesSearch;
            });

                        <i class="fa-solid fa-inbox text-4xl mb-3 text-gray-300"></i>
                        <p>${t('noTools')}</p>

                return;

                const toolDesc = t(tool.descKey);

                    // For internal links, add language suffix if Chinese

                    }

                <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-[0_2px_8px_rgba(0,0,0,0.04)] hover:shadow-[0_4px_16px_rgba(0,0,0,0.08)] transition-shadow duration-300 flex flex-col h-full group cursor-pointer" onclick="${targetLink ? `window.location.href='${targetLink}'` : ''}">

                    <div class="flex items-center gap-3 mb-3">
                        <!-- Icon -->
                        <div class="${logoContainerClass} mb-0 shrink-0">
                            ${iconHtml.replace('text-2xl', 'text-xl')}
                        </div>
                        
                        <!-- Title & Vendor -->
                        <div>
                            <h3 class="text-lg font-bold text-gray-900 leading-tight group-hover:text-blue-600 transition-colors">${toolName}</h3>
                        </div>
                    </div>

                    <!-- Tag -->
                    <div class="mb-3">
                        <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-medium ${tool.categoryStyle}">
                            ${tool.category}
                        </span>
                    </div>

                    <!-- Description -->
                    <div class="flex-grow mb-4">
                        <p class="text-xs text-gray-500 leading-relaxed line-clamp-2">
                            ${toolDesc}
                        </p>
                    </div>

                    <!-- Footer -->
                    <div class="pt-3 border-t border-gray-50 flex items-center justify-between text-[10px] text-gray-400 mt-auto">
                        <span class="font-medium text-gray-500">${tool.meta}</span>
                        <div class="w-5 h-5 rounded flex items-center justify-center hover:bg-gray-100 transition-colors text-gray-300 hover:text-gray-600">
                            <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        // --- Interaction Functions ---

        function setFilter(id) {
            categories.forEach(c => c.active = (c.id === id));
            renderFilters();
            
            const searchVal = document.getElementById('searchInput').value;
            renderTools(id, searchVal);
        }

        // --- Event Listeners ---

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const activeCat = categories.find(c => c.active).id;
            renderTools(activeCat, e.target.value);
        });

        // --- Init ---
        renderFilters();
        renderTools();

    </script>
</body>
