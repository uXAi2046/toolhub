<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Requests Admin - Tool Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background-color: #F9FAFB; }</style>
</head>
<body class="text-slate-900 antialiased min-h-screen">
    <div class="max-w-6xl mx-auto px-6 py-8">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900">Tool Request Management</h1>
            <a href="index.html" class="text-blue-600 hover:text-blue-700 font-medium">Back to Home</a>
        </header>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-50 text-gray-900 font-semibold border-b border-gray-200">
                        <tr>
                            <th class="px-6 py-4">Tool Name</th>
                            <th class="px-6 py-4">Description</th>
                            <th class="px-6 py-4">Features</th>
                            <th class="px-6 py-4">Date</th>
                        </tr>
                    </thead>
                    <tbody id="requestTableBody" class="divide-y divide-gray-100">
                        <!-- Rows will be populated by JS -->
                    </tbody>
                </table>
            </div>
            <div id="emptyState" class="hidden p-8 text-center text-gray-500">
                No tool requests found.
            </div>
        </div>
    </div>

    <script>
        function loadRequests() {
            const requests = JSON.parse(localStorage.getItem('toolRequests') || '[]');
            const tbody = document.getElementById('requestTableBody');
            const emptyState = document.getElementById('emptyState');

            if (requests.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            tbody.innerHTML = requests.map(req => `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4 font-medium text-gray-900">${escapeHtml(req.toolName)}</td>
                    <td class="px-6 py-4 max-w-xs truncate" title="${escapeHtml(req.description)}">${escapeHtml(req.description)}</td>
                    <td class="px-6 py-4 max-w-xs truncate" title="${escapeHtml(req.features || '-')}">${escapeHtml(req.features || '-')}</td>
                    <td class="px-6 py-4 text-gray-400 text-xs">${new Date(req.date).toLocaleString()}</td>
                </tr>
            `).join('');
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        loadRequests();
    </script>
</body>
</html>
